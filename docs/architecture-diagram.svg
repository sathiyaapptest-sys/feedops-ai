<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1020" font-family="'Inter', 'SF Pro Display', -apple-system, sans-serif">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1729"/>
      <stop offset="100%" stop-color="#121a2e"/>
    </linearGradient>
    <!-- Core box gradient -->
    <linearGradient id="coreGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2540"/>
      <stop offset="100%" stop-color="#162035"/>
    </linearGradient>
    <!-- Entry point box gradient -->
    <linearGradient id="entryGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2d4a"/>
      <stop offset="100%" stop-color="#192640"/>
    </linearGradient>
    <!-- Agent pill -->
    <linearGradient id="agentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a3a4a"/>
      <stop offset="100%" stop-color="#15303f"/>
    </linearGradient>
    <!-- RAG pill -->
    <linearGradient id="ragGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a3a4a"/>
      <stop offset="100%" stop-color="#15303f"/>
    </linearGradient>
    <!-- Feed tools pill -->
    <linearGradient id="feedGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a3a4a"/>
      <stop offset="100%" stop-color="#15303f"/>
    </linearGradient>
    <!-- Jobs pill -->
    <linearGradient id="jobsGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a3a4a"/>
      <stop offset="100%" stop-color="#15303f"/>
    </linearGradient>
    <!-- Firestore gradient -->
    <linearGradient id="firestoreGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2540"/>
      <stop offset="100%" stop-color="#162035"/>
    </linearGradient>
    <!-- Google services gradient -->
    <linearGradient id="googleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2540"/>
      <stop offset="100%" stop-color="#162035"/>
    </linearGradient>
    <!-- Glow filter for emphasis -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- Arrow markers -->
    <marker id="arrowTeal" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#4fd1c5" stroke-width="1.2"/>
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#d4a054" stroke-width="1.2"/>
    </marker>
    <marker id="arrowSlate" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#64748b" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1020" fill="url(#bgGrad)" rx="12"/>

  <!-- ===== HEADER ===== -->
  <text x="60" y="52" fill="#4fd1c5" font-size="13" font-weight="600" letter-spacing="3" font-family="'JetBrains Mono', 'SF Mono', 'Fira Code', monospace">SYSTEM OVERVIEW</text>
  <text x="60" y="95" fill="#e2e8f0" font-size="36" font-weight="700">FeedOps AI, at a glance</text>
  <text x="60" y="125" fill="#94a3b8" font-size="16" font-weight="400">Three ways in, one core, one source of truth, one place the system can't automate.</text>

  <!-- ===== MAIN DIAGRAM AREA (inset card) ===== -->
  <rect x="40" y="150" width="1120" height="770" rx="16" fill="#0d1321" stroke="#1e293b" stroke-width="1"/>

  <!-- ===== ENTRY POINTS ROW ===== -->
  <!-- Browser -->
  <rect x="90" y="185" width="260" height="70" rx="10" fill="url(#entryGrad)" stroke="#2d3f5e" stroke-width="1"/>
  <text x="220" y="215" fill="#e2e8f0" font-size="16" font-weight="600" text-anchor="middle">Browser</text>
  <text x="220" y="236" fill="#64748b" font-size="12" text-anchor="middle">aggregators &amp; merchants</text>

  <!-- MCP Client -->
  <rect x="400" y="185" width="260" height="70" rx="10" fill="url(#entryGrad)" stroke="#2d3f5e" stroke-width="1"/>
  <text x="530" y="215" fill="#e2e8f0" font-size="16" font-weight="600" text-anchor="middle">MCP Client</text>
  <text x="530" y="236" fill="#64748b" font-size="12" text-anchor="middle">Claude, or any AI tool</text>

  <!-- Google Cloud Scheduler -->
  <rect x="710" y="185" width="310" height="70" rx="10" fill="url(#entryGrad)" stroke="#2d3f5e" stroke-width="1"/>
  <text x="865" y="215" fill="#e2e8f0" font-size="16" font-weight="600" text-anchor="middle">Google Cloud Scheduler</text>
  <text x="865" y="236" fill="#64748b" font-size="12" text-anchor="middle">daily &amp; weekly jobs</text>

  <!-- ===== ARROWS FROM ENTRY POINTS TO CORE ===== -->
  <line x1="220" y1="255" x2="220" y2="295" stroke="#4fd1c5" stroke-width="1.5" marker-end="url(#arrowTeal)"/>
  <line x1="530" y1="255" x2="530" y2="295" stroke="#4fd1c5" stroke-width="1.5" marker-end="url(#arrowTeal)"/>
  <line x1="865" y1="255" x2="865" y2="295" stroke="#4fd1c5" stroke-width="1.5" marker-end="url(#arrowTeal)"/>

  <!-- ===== CORE BOX ===== -->
  <rect x="90" y="300" width="930" height="310" rx="14" fill="url(#coreGrad)" stroke="#2d4a5e" stroke-width="1.2"/>

  <!-- Core title -->
  <text x="555" y="334" fill="#e2e8f0" font-size="20" font-weight="700" text-anchor="middle">FeedOps AI</text>

  <!-- Frontend / Backend split labels -->
  <!-- Thin divider line -->
  <line x1="130" y1="355" x2="980" y2="355" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Frontend label (left) -->
  <text x="140" y="374" fill="#4fd1c5" font-size="11" font-weight="500" font-family="'JetBrains Mono', 'SF Mono', monospace" letter-spacing="1.5">FRONTEND</text>
  <text x="240" y="374" fill="#64748b" font-size="11">React / Vite · TypeScript · Firebase Auth</text>

  <!-- Backend label (left) -->
  <text x="140" y="408" fill="#4fd1c5" font-size="11" font-weight="500" font-family="'JetBrains Mono', 'SF Mono', monospace" letter-spacing="1.5">BACKEND</text>
  <text x="235" y="408" fill="#64748b" font-size="11">FastAPI · ADK Orchestrator · MCP Server</text>

  <!-- Thin divider after labels -->
  <line x1="130" y1="422" x2="980" y2="422" stroke="#1e293b" stroke-width="1"/>

  <!-- ===== INTERNAL COMPONENT PILLS — 2×2 grid ===== -->
  <!-- Row 1 -->
  <!-- 4 ADK Agents -->
  <rect x="130" y="440" width="260" height="60" rx="8" fill="url(#agentGrad)" stroke="#2d4a5e" stroke-width="1"/>
  <text x="260" y="465" fill="#4fd1c5" font-size="14" font-weight="600" text-anchor="middle">4 ADK Agents</text>
  <text x="260" y="484" fill="#64748b" font-size="11" text-anchor="middle">Gemini + Gemma · real Runner execution</text>

  <!-- RAG -->
  <rect x="420" y="440" width="260" height="60" rx="8" fill="url(#ragGrad)" stroke="#2d4a5e" stroke-width="1"/>
  <text x="550" y="465" fill="#4fd1c5" font-size="14" font-weight="600" text-anchor="middle">RAG</text>
  <text x="550" y="484" fill="#64748b" font-size="11" text-anchor="middle">grounded on the real playbook</text>

  <!-- Row 2 -->
  <!-- Feed Tools -->
  <rect x="130" y="516" width="260" height="60" rx="8" fill="url(#feedGrad)" stroke="#4fd1c5" stroke-width="1" stroke-opacity="0.4"/>
  <text x="260" y="541" fill="#5ee6d6" font-size="14" font-weight="600" text-anchor="middle">Feed Tools</text>
  <text x="260" y="560" fill="#64748b" font-size="11" text-anchor="middle">match · compile (proto) · SFTP deliver</text>

  <!-- Scheduled Jobs -->
  <rect x="420" y="516" width="260" height="60" rx="8" fill="url(#jobsGrad)" stroke="#2d4a5e" stroke-width="1"/>
  <text x="550" y="541" fill="#4fd1c5" font-size="14" font-weight="600" text-anchor="middle">Scheduled Jobs</text>
  <text x="550" y="560" fill="#64748b" font-size="11" text-anchor="middle">daily feed push · weekly conversion sweep</text>

  <!-- Data Adapter (smaller, right side) -->
  <rect x="710" y="440" width="260" height="60" rx="8" fill="url(#agentGrad)" stroke="#2d4a5e" stroke-width="1"/>
  <text x="840" y="465" fill="#4fd1c5" font-size="14" font-weight="600" text-anchor="middle">Data Adapters</text>
  <text x="840" y="484" fill="#64748b" font-size="11" text-anchor="middle">per-org column mapping · Gemma fallback</text>

  <!-- MCP Server (smaller, right side) -->
  <rect x="710" y="516" width="260" height="60" rx="8" fill="url(#jobsGrad)" stroke="#2d4a5e" stroke-width="1"/>
  <text x="840" y="541" fill="#4fd1c5" font-size="14" font-weight="600" text-anchor="middle">MCP Server</text>
  <text x="840" y="560" fill="#64748b" font-size="11" text-anchor="middle">9 tools · stdio transport</text>

  <!-- ===== ARROWS FROM CORE TO BOTTOM LAYER ===== -->

  <!-- Arrow: Core → Firestore (solid, teal) -->
  <line x1="320" y1="610" x2="320" y2="655" stroke="#4fd1c5" stroke-width="1.5" marker-end="url(#arrowTeal)"/>
  <!-- Label -->
  <text x="254" y="640" fill="#4fd1c5" font-size="11" font-family="'JetBrains Mono', 'SF Mono', monospace">reads / writes</text>

  <!-- Arrow: Core → Google services (dashed, amber/gold) -->
  <line x1="780" y1="610" x2="780" y2="655" stroke="#d4a054" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowAmber)"/>
  <!-- Label -->
  <text x="726" y="640" fill="#d4a054" font-size="11" font-family="'JetBrains Mono', 'SF Mono', monospace">API calls</text>

  <!-- ===== BOTTOM LAYER: FIRESTORE + GOOGLE SERVICES ===== -->
  <!-- Firestore -->
  <rect x="90" y="660" width="440" height="90" rx="12" fill="url(#firestoreGrad)" stroke="#2d4a5e" stroke-width="1.2"/>
  <text x="310" y="694" fill="#4fd1c5" font-size="17" font-weight="600" text-anchor="middle">Firestore</text>
  <text x="310" y="714" fill="#94a3b8" font-size="12" text-anchor="middle">the one source of truth</text>
  <text x="310" y="734" fill="#64748b" font-size="11" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', monospace">merchants · orgs · batches · menus · conversion_checks</text>

  <!-- Google's own services -->
  <rect x="580" y="660" width="440" height="90" rx="12" fill="url(#googleGrad)" stroke="#d4a054" stroke-width="1" stroke-opacity="0.4"/>
  <text x="800" y="694" fill="#d4a054" font-size="17" font-weight="600" text-anchor="middle">Google's own services</text>
  <text x="800" y="714" fill="#94a3b8" font-size="12" text-anchor="middle">Gemini · Gemma · Places · SFTP</text>
  <text x="800" y="734" fill="#64748b" font-size="11" text-anchor="middle">Actions Center · Firebase Auth</text>

  <!-- ===== HUMAN-IN-THE-LOOP CALLOUT ===== -->
  <!-- Dashed arrow from Google Services down to callout -->
  <line x1="800" y1="750" x2="800" y2="778" stroke="#d4a054" stroke-width="1.2" stroke-dasharray="3,3"/>
  <circle cx="800" cy="778" r="3" fill="#d4a054" opacity="0.6"/>

  <!-- Gold/amber dashed callout box -->
  <rect x="305" y="790" width="550" height="62" rx="10" fill="#1a1a10" stroke="#d4a054" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="580" y="816" fill="#d4a054" font-size="13" font-weight="600" text-anchor="middle">No API confirms a feed was accepted.</text>
  <text x="580" y="836" fill="#a08050" font-size="11.5" text-anchor="middle">A human checks Google's portal and records the result here.</text>

  <!-- ===== FOOTER TAGLINE ===== -->
  <text x="555" y="892" fill="#64748b" font-size="13" text-anchor="middle">Three doors, one core. The core persists everything to Firestore and talks to Google directly —</text>
  <text x="555" y="910" fill="#64748b" font-size="13" text-anchor="middle">except the one thing Google itself gives no API for: confirming a feed was accepted.</text>

  <!-- ===== BOTTOM RULE + ATTRIBUTION ===== -->
  <line x1="60" y1="940" x2="1140" y2="940" stroke="#1e293b" stroke-width="1"/>
  <text x="60" y="968" fill="#475569" font-size="12" font-family="'JetBrains Mono', 'SF Mono', monospace">feedops-ai · see the full architecture breakdown in the README</text>

  <!-- ===== LEGEND (bottom-right) ===== -->
  <line x1="840" y1="958" x2="870" y2="958" stroke="#4fd1c5" stroke-width="1.5"/>
  <text x="878" y="962" fill="#64748b" font-size="10">internal data flow</text>

  <line x1="980" y1="958" x2="1010" y2="958" stroke="#d4a054" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="1018" y="962" fill="#64748b" font-size="10">external API calls</text>
</svg>
